name: Build Wanbo HDMI2 APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Android environment
        run: |
          java -version
          gradle --version
          ls -la

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q Wanbo_HDMI2_Launcher_Project.zip -d project
          echo "Project contents:"
          find project -maxdepth 3 -type f | head -100

      - name: Build APK
        working-directory: project
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Find APK
        run: |
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wanbo-HDMI2-APK
          path: project/**/*.apk
